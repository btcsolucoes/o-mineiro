<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ô Mineiro Restaurante</title>
  <desc id="desc">Marca vetorizada do Ô Mineiro inspirada na logo pública do perfil oficial.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2a0e08" flood-opacity=".28"/>
    </filter>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe06f"/>
      <stop offset=".52" stop-color="#f6c23e"/>
      <stop offset="1" stop-color="#d69321"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c92019"/>
      <stop offset="1" stop-color="#861711"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <path d="M183 341c0-185 176-306 416-306 238 0 418 122 418 306v44H183z" fill="#a82319"/>
    <path d="M223 338c0-157 160-260 376-260 214 0 378 104 378 260v19H223z" fill="#f2bd36"/>
    <path d="M261 329c11-132 152-216 338-216 184 0 328 86 339 216H261z" fill="url(#plate)" filter="url(#rough)"/>

    <path d="M151 354h898c30 0 55 24 55 54v91c0 30-25 55-55 55H151c-30 0-55-25-55-55v-91c0-30 25-54 55-54z" fill="#a51d16"/>
    <path d="M167 376h866c17 0 31 14 31 31v73c0 17-14 31-31 31H167c-17 0-31-14-31-31v-73c0-17 14-31 31-31z" fill="url(#plate)" filter="url(#rough)"/>

    <path d="M271 542h662l-42 77H312z" fill="url(#ribbon)"/>
    <path d="M345 610h510l-20 39H364z" fill="#5d140e"/>

    <text x="600" y="472"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="156"
      font-weight="900"
      letter-spacing="-2"
      fill="#991911"
      stroke="#fff1a8"
      stroke-width="7"
      paint-order="stroke">
      Ô MINEIRO
    </text>

    <path d="M352 546c56 22 139 35 246 35 106 0 190-13 250-35" fill="none" stroke="#23120b" stroke-width="12" stroke-linecap="round" opacity=".86"/>
    <path d="M386 546c48 13 118 21 212 21 93 0 164-8 217-21" fill="none" stroke="#d51f17" stroke-width="18" stroke-linecap="round"/>
    <path d="M284 299c-2-86 54-151 150-194" fill="none" stroke="#fff0a7" stroke-width="8" stroke-linecap="round" opacity=".58"/>
    <path d="M914 298c-5-87-64-151-160-193" fill="none" stroke="#7f1710" stroke-width="8" stroke-linecap="round" opacity=".38"/>
  </g>
</svg>
